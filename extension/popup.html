<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>I-Pilot</title>
    <style>
      :root { --bg: #fff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #2563eb; --chip: #f1f5f9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --chip: #1e293b; } }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      header img { width: 28px; height: 28px; }
      header h1 { font-size: 16px; margin: 0; flex: 1; }
      section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .muted { color: var(--muted); font-size: 12px; }
      .err { color: #dc2626; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
      button { font: inherit; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; background: var(--chip); color: var(--fg); font-weight: 600; }
      button.primary { background: var(--brand); color: #fff; }
      .conds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .conds button.on { outline: 2px solid var(--brand); }
      .actions { display: flex; gap: 8px; }
      .actions button { flex: 1; }
      input[type=range] { width: 150px; accent-color: var(--brand); }
      .switch { position: relative; width: 44px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch span { position: absolute; inset: 0; border-radius: 12px; background: #cbd5e1; transition: .2s; }
      .switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
      .switch input:checked + span { background: var(--brand); }
      .switch input:checked + span::after { left: 23px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <h1>I-Pilot</h1>
      <label class="switch" title="Enable I-Pilot"><input id="enabled" type="checkbox" /><span></span></label>
    </header>
    <section>
      <div id="camera">…</div>
      <div id="calib" class="muted"></div>
      <div class="actions" style="margin-top: 10px">
        <button id="calibrate" class="primary">Calibrate on this page</button>
        <button id="pause">Pause</button>
      </div>
    </section>
    <section>
      <div class="muted" style="margin-bottom: 6px">Condition</div>
      <div class="conds">
        <button data-cond="A">A · Raw</button>
        <button data-cond="B">B · Dwell</button>
        <button data-cond="C">C · Blink</button>
      </div>
    </section>
    <section>
      <div class="row"><span>Blink length</span><span><input id="blinkMs" type="range" min="300" max="1500" step="50" /> <span id="blinkMsOut" class="muted"></span></span></div>
      <div class="row"><span>Dwell time</span><span><input id="dwellMs" type="range" min="400" max="3000" step="100" /> <span id="dwellMsOut" class="muted"></span></span></div>
      <div class="row">
        <span>Action</span>
        <select id="action"><option value="click">Click</option><option value="dblclick">Double click</option></select>
      </div>
      <div class="row"><span>Confirm delete / pay / submit</span><input id="confirm" type="checkbox" /></div>
    </section>
    <section class="muted">
      Video never leaves this device. Alt+Shift+P pauses. Camera blocked?
      <button id="permission" style="padding: 4px 8px; font-size: 12px">Grant camera access</button>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>

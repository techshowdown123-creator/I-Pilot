<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>I-Pilot · Camera access</title>
    <style>
      :root { --bg: #f8fafc; --card: #fff; --fg: #0f172a; --muted: #475569; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 520px; background: var(--card); border-radius: 18px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: var(--muted); }
      button { font: 600 16px system-ui; border: 0; border-radius: 12px; padding: 12px 20px; background: #2563eb; color: #fff; cursor: pointer; }
      #msg { margin-top: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow camera access for I-Pilot</h1>
      <p>I-Pilot needs your webcam to estimate where you are looking and to detect deliberate blinks. Frames are analysed on this device and are never stored or uploaded.</p>
      <button id="grant">Allow camera</button>
      <div id="msg"></div>
    </main>
    <script type="module" src="permission.js"></script>
  </body>
</html>
